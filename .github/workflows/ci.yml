name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        # Settings() validiert beim Import; ohne diese Variablen bricht schon
        # conftest.py ab. SQLite in-memory, damit kein Postgres-Service noetig ist.
        env:
          JWT_SECRET_KEY: "ci-only-dummy-secret-key-at-least-32-chars-long"
          # Quoten ist Pflicht: ":memory:" endet auf einem Doppelpunkt am
          # Zeilenende, was YAML als Mapping-Indikator liest
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          # Defaults zeigen nach /app/... (Pfade im Container). Auf dem Runner
          # gibt es kein /app, und _ensure_app_data_subdirs() legt sie beim
          # Startup an — sonst PermissionError in jedem Test, der die App startet.
          UPLOADS_DIR: "${{ runner.temp }}/uploads"
          RATES_CACHE_PATH: "${{ runner.temp }}/cache/rates.json"
        run: pytest tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build


  # ── Auto-Publish auf Strato: nur bei Push auf main, nie bei Pull Requests ──
  # Einrichtung und Secrets: README, Abschnitt "Deployment auf Strato".

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ghcr.io/doebele/budget-pal/${{ matrix.image }}:latest
            ghcr.io/doebele/budget-pal/${{ matrix.image }}:${{ steps.tag.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build-and-push
    # Schalter: Repository-Variable DEPLOY_ENABLED=true, sobald Server und
    # Secrets eingerichtet sind. Ohne sie endet der Lauf nach dem Image-Build.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-strato
      cancel-in-progress: false
    env:
      HOST: ${{ secrets.STRATO_HOST }}
      DEPLOY_USER: ${{ secrets.STRATO_USER }}
      DEPLOY_PATH: ${{ secrets.STRATO_DEPLOY_PATH }}
    steps:
      - name: SSH einrichten
        env:
          SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          # Fester Host-Key statt ssh-keyscan: sonst wuerde die Action jedem
          # Server vertrauen, der sich unter der Adresse meldet
          KNOWN_HOSTS: ${{ secrets.STRATO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host strato\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "$HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: Ausrollen
        env:
          ENV_FILE: ${{ secrets.STRATO_ENV_FILE }}
        run: |
          ssh strato "cd '$DEPLOY_PATH' && git pull --ff-only -q origin main"
          # .env ueber stdin, damit die Werte nicht in einer Befehlszeile stehen
          printf '%s\n' "$ENV_FILE" | ssh strato "umask 077 && cat > '$DEPLOY_PATH/.env'"
          ssh strato "cd '$DEPLOY_PATH' && IMAGE_TAG=${GITHUB_SHA::7} ./deploy.sh"
      - name: Von aussen pruefen
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://budgetpal.doebele12.de/api/health
