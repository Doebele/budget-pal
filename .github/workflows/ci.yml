name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        # Settings() validiert beim Import; ohne diese Variablen bricht schon
        # conftest.py ab. SQLite in-memory, damit kein Postgres-Service noetig ist.
        env:
          JWT_SECRET_KEY: ci-only-dummy-secret-key-at-least-32-chars-long
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: pytest tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

